<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#15191b" />
    <meta
      name="description"
      content="Bonk Club: a browser fighting game for 2–4 players with physics combat, local multiplayer and online rooms."
    />
    <title>Bonk Club</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <div id="app">
      <header>
        <a class="brand" href="./" aria-label="Bonk Club home"
          ><span class="brand-mark">b.</span> BONK CLUB</a
        >
        <div class="header-actions">
          <button id="help" class="icon-button" aria-label="How to play">
            ?</button
          ><button id="sound" class="icon-button" aria-label="Mute sound">
            ♪</button
          ><button
            id="fullscreen"
            class="icon-button"
            aria-label="Toggle fullscreen"
          >
            ⛶
          </button>
        </div>
      </header>
      <main id="stage">
        <canvas
          id="game"
          width="1280"
          height="720"
          aria-label="Bonk Club fighting arena"
        ></canvas>
        <div id="hud" class="hidden">
          <div id="scoreboard"></div>
          <div class="round-meta">
            <span id="arena-name"></span><b id="round-label"></b>
          </div>
          <button
            id="pause"
            class="icon-button"
            aria-label="Pause or leave match"
          >
            Ⅱ
          </button>
        </div>
        <div id="announcement" role="status" aria-live="polite"></div>
        <section id="menu" class="menu-panel">
          <h1>BONK<br /><span>CLUB</span></h1>
          <div class="menu-buttons">
            <button id="local" class="button primary">
              LOCAL MULTIPLAYER <span>↗</span></button
            ><button id="online" class="button secondary">
              ONLINE MULTIPLAYER <span>↗</span>
            </button>
          </div>
        </section>
        <section
          id="panel"
          class="dialog hidden"
          aria-labelledby="panel-title"
        ></section>
        <div id="touch-controls" class="hidden" aria-label="Touch controls">
          <div>
            <button data-input="left" aria-label="Move left">◀</button
            ><button data-input="right" aria-label="Move right">▶</button>
          </div>
          <div>
            <button data-input="block" aria-label="Block">◈</button
            ><button data-input="jump" aria-label="Jump">↑</button
            ><button data-input="attack" aria-label="Attack">✳</button
            ><button data-input="throw" aria-label="Throw weapon">↓</button>
          </div>
        </div>
      </main>
      <footer><span id="footer-hint"></span></footer>
      <div id="toast" class="hidden" role="status"></div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
